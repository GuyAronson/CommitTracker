<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PR Commit Tracker</title>
    <style>
      :root {
        color-scheme: light dark;
        --ct-fg: #1f2328;
        --ct-muted: #57606a;
        --ct-border: #d0d7de;
        --ct-bg: #ffffff;
        --ct-danger: #cf222e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ct-fg: #e6edf3;
          --ct-muted: #9198a1;
          --ct-border: #30363d;
          --ct-bg: #0d1117;
          --ct-danger: #f85149;
        }
      }

      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: var(--ct-bg);
        color: var(--ct-fg);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 600;
      }

      .pr {
        margin: 0 0 4px;
        color: var(--ct-muted);
        word-break: break-all;
      }

      .progress {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
      }

      button {
        width: 100%;
        padding: 7px 12px;
        border: 1px solid var(--ct-border);
        border-radius: 6px;
        background: transparent;
        color: var(--ct-danger);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: var(--ct-danger);
      }

      button:disabled {
        color: var(--ct-muted);
        cursor: not-allowed;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h1>PR Commit Tracker</h1>
    <p class="pr" id="pr-label">Loading…</p>
    <p class="progress" id="progress"></p>
    <button id="reset" type="button" disabled>Reset PR Progress</button>
    <script src="popup.js"></script>
  </body>
</html>
